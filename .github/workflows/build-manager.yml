name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:
  workflow_call:

jobs:
  # The certificate MUST be selected before the kernel module is built.
  # A build without repository signing secrets uses a per-run throwaway key.
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
      mode: ${{ steps.sign.outputs.mode }}
      expected_size: ${{ steps.sign.outputs.expected_size }}
      expected_hash: ${{ steps.sign.outputs.expected_hash }}
      keystore: ${{ steps.sign.outputs.keystore }}
      keystore_password: ${{ steps.sign.outputs.keystore_password }}
      key_password: ${{ steps.sign.outputs.key_password }}
    steps:
      - name: Checkout package name configuration
        uses: actions/checkout@v7

      - name: Read manager package name from Gradle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import os
          import re

          gradle = Path('manager/app/build.gradle.kts').read_text(encoding='utf-8')
          match = re.search(
              r'val defaultManagerPackageName\s*=\s*if\s*\(isPrBuild\)\s*"([a-zA-Z_][a-zA-Z_0-9.]*)"\s*else\s*"([a-zA-Z_][a-zA-Z_0-9.]*)"',
              gradle,
          )
          if not match:
              raise SystemExit('Cannot read manager package name from build.gradle.kts')
          package = match.group(1) if os.environ['GITHUB_EVENT_NAME'] == 'pull_request' else match.group(2)
          print(f'package_name={package}')
          print(f'Manager package: {package}', file=__import__('sys').stderr)
          PYCODE

      - name: Select signing key and read certificate identity
        id: sign
        shell: bash
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && -n "$PROD_KEYSTORE" && -n "$PROD_KEYSTORE_PASSWORD" && -n "$PROD_KEY_ALIAS" && -n "$PROD_KEY_PASSWORD" ]]; then
            # Never expose the production keystore or passwords via job outputs/artifacts.
            printf '%s' "$PROD_KEYSTORE" | base64 -d > ci-key.jks
            KEY_ALIAS="$PROD_KEY_ALIAS"
            STORE_PASS="$PROD_KEYSTORE_PASSWORD"
            echo "mode=persistent" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" != "pull_request" && ( -n "$PROD_KEYSTORE" || -n "$PROD_KEYSTORE_PASSWORD" || -n "$PROD_KEY_ALIAS" || -n "$PROD_KEY_PASSWORD" ) ]]; then
              echo '::error::Set ALL four signing secrets (KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD), or none for an ephemeral CI build.'
              exit 1
            fi
            KEY_ALIAS='ci-key'
            STORE_PASS="$(openssl rand -hex 24)"
            keytool -genkeypair \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 \
              -validity 3650 \
              -storetype JKS \
              -keystore ci-key.jks \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname 'CN=KernelSU CI Build'
            echo "mode=temporary" >> "$GITHUB_OUTPUT"
            echo "keystore=$(base64 -w 0 ci-key.jks)" >> "$GITHUB_OUTPUT"
            echo "keystore_password=$STORE_PASS" >> "$GITHUB_OUTPUT"
            echo "key_password=$STORE_PASS" >> "$GITHUB_OUTPUT"
            echo '::warning::Using a NEW signing certificate for this run. Configure all four signing secrets for upgradable releases.'
          fi

          keytool -exportcert \
            -alias "$KEY_ALIAS" \
            -keystore ci-key.jks \
            -storepass "$STORE_PASS" \
            -file ci-cert.der
          SIZE_DEC="$(stat -c%s ci-cert.der)"
          # kernel/manager/apk_sign.c has a 1024-byte DER certificate limit.
          if (( SIZE_DEC > 1024 )); then
            echo "::error::Signing certificate ($SIZE_DEC bytes) exceeds kernel verification limit (1024)."
            exit 1
          fi
          printf 'expected_size=0x%04x\n' "$SIZE_DEC" >> "$GITHUB_OUTPUT"
          echo "expected_hash=$(sha256sum ci-cert.der | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      package_name: ${{ needs.generate-key.outputs.package_name }}
      expected_size: ${{ needs.generate-key.outputs.expected_size }}
      expected_hash: ${{ needs.generate-key.outputs.expected_hash }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [generate-key, build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
          - target: riscv64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      package_name: ${{ needs.generate-key.outputs.package_name }}
      pack_lkm: true
      pack_ksuinit: true
  
  build-ksud-extra:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu # windows pc
            os: ubuntu-latest
          - target: x86_64-apple-darwin # Intel mac
            os: macos-latest
          - target: aarch64-apple-darwin # M chip mac
            os: macos-latest
          - target: aarch64-unknown-linux-musl # arm64 Linux
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl # x86 Linux
            os: ubuntu-latest
    uses: ./.github/workflows/ksud-extra.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}
      pack_lkm: true
      pack_ksuinit: true

  build-manager:
    needs: [generate-key]
    if: always() && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare matching signing key for Gradle
        shell: bash
        env:
          SIGN_MODE: ${{ needs.generate-key.outputs.mode }}
          TEMP_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          TEMP_STORE_PASS: ${{ needs.generate-key.outputs.keystore_password }}
          TEMP_KEY_PASS: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$SIGN_MODE" == 'temporary' ]]; then
            printf '%s' "$TEMP_KEYSTORE" | base64 -d > key.jks
            KEY_ALIAS='ci-key'
            STORE_PASS="$TEMP_STORE_PASS"
            KEY_PASS="$TEMP_KEY_PASS"
          elif [[ "$SIGN_MODE" == 'persistent' ]]; then
            printf '%s' "$PROD_KEYSTORE" | base64 -d > key.jks
            KEY_ALIAS="$PROD_KEY_ALIAS"
            STORE_PASS="$PROD_KEYSTORE_PASSWORD"
            KEY_PASS="$PROD_KEY_PASSWORD"
          else
            echo "::error::Unknown signing mode: $SIGN_MODE"
            exit 1
          fi
          test -s key.jks
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          # ORG_GRADLE_PROJECT_* avoids putting passwords into tracked files.
          {
            echo 'ORG_GRADLE_PROJECT_KEYSTORE_FILE=key.jks'
            echo "ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ORG_GRADLE_PROJECT_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew clean assembleRelease -PIS_PR_BUILD=true
          else
            ./gradlew clean assembleRelease
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        if: ${{ ( github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' )) || github.ref_type == 'tag' }}
        with:
          name: "mappings"
          path: "manager/app/build/outputs/mapping/release/"

  repack-manager:
    needs: [build-manager, build-ksud, generate-key]
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download RISC-V ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-riscv64-linux-android
          path: artifacts/ksud-riscv64-linux-android

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/x86_64-linux-android/release
          mkdir -p target/riscv64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          RISCV64_KSUD=$(find artifacts/ksud-riscv64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$X86_64_KSUD"
          test -n "$RISCV64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud
          cp -f "$RISCV64_KSUD" target/riscv64-linux-android/release/ksud

      - name: Repack and sign with the matching certificate
        shell: bash
        env:
          SIGN_MODE: ${{ needs.generate-key.outputs.mode }}
          TEMP_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          TEMP_STORE_PASS: ${{ needs.generate-key.outputs.keystore_password }}
          TEMP_KEY_PASS: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$SIGN_MODE" == 'temporary' ]]; then
            printf '%s' "$TEMP_KEYSTORE" | base64 -d > ci-key.jks
            KEY_ALIAS='ci-key'
            STORE_PASS="$TEMP_STORE_PASS"
            KEY_PASS="$TEMP_KEY_PASS"
          elif [[ "$SIGN_MODE" == 'persistent' ]]; then
            printf '%s' "$PROD_KEYSTORE" | base64 -d > ci-key.jks
            KEY_ALIAS="$PROD_KEY_ALIAS"
            STORE_PASS="$PROD_STORE_PASS"
            KEY_PASS="$PROD_KEY_PASS"
          else
            echo "::error::Unknown signing mode: $SIGN_MODE"
            exit 1
          fi
          test -s ci-key.jks
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -a x86_64 \
            -a riscv64 \
            -K ci-key.jks \
            -A "$KEY_ALIAS" \
            -P "$STORE_PASS" \
            -S "$KEY_PASS" \
            --strip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager
          path: dist/*.apk

      - name: Upload to telegram
        if: github.event_name != 'pull_request' && steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          GITHUB_EVENT: ${{ toJson(github.event) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Manager
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            export VERSION=$(git rev-list --count HEAD)
            APK=$(find ./dist -name "*.apk")
            pip3 install telethon
            python3 $GITHUB_WORKSPACE/scripts/ksubot.py $APK
          fi
